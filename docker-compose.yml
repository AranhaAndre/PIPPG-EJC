services:
  doacoes:
    build: .
    container_name: alvo-doacoes
    restart: unless-stopped
    env_file: .env
    ports:
      # host:container — porta 8090 no host. Ajuste se precisar.
      - "127.0.0.1:8090:8000"
    volumes:
      - doacoes_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  doacoes_data:
